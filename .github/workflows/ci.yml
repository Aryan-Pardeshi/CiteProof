name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install ruff==0.17.1
      - run: ruff check .
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q
        env:
          LLM_API_KEY: test-key
